security:
  allowed_paths:
    - "./tmp"
    - "./mingw64/bin"
  forbidden_commands:
    - "rm -rf"
    - "format"
    - "del"
    - "chmod 777"
    
execution:
  max_time: 5000  # 最大运行时间(ms)
  max_memory: 256  # 最大内存(MB)
  max_output_size: 1048576  # 最大输出大小(1MB)
  
compilation:
  compiler_path: "auto"  # auto: 依次尝试 MinGW、PATH 中的 g++/clang++
  cpp_standard: "c++17"
  optimization_level: "-O2"
  
paths:
  temp_dir: "./tmp"  # 相对配置文件所在目录解析
  mingw_dir: "./mingw64"  # 可选，不存在时使用 PATH 中的工具链
  gdb_path: "auto"  # auto: 依次尝试 MinGW、PATH 中的 gdb
  cache_expiry: 300  # 缓存过期时间(秒)
  
toolchain:
  auto_install: true  # 系统没有编译器时自动下载到缓存目录
  prefer: "system"  # system: 优先系统工具链；managed: 优先托管工具链
  cache_dir: null  # null: 使用用户缓存目录
  install_timeout: 900  # 首次等待自动安装的秒数
  mirror: null  # 可选：工具链下载镜像（目录或 URL 前缀）

logging:
  level: "INFO"
  audit_log: "./audit.log"