name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Check toolchain detection
        run: uv run mcp-oi-assistant --check-toolchain

      - name: Smoke test entry point
        run: uvx --from . mcp-oi-assistant --version
